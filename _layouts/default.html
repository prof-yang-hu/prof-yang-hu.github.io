<!DOCTYPE html>
<html lang="{{ page.lang | default: site.langs[0] | default: "en" }}">

  {% include head.html %}

  <!-- <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet"> -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQVKDJX0C3"></script>
     <script>
       window.dataLayer = window.dataLayer || [];
       function gtag(){dataLayer.push(arguments);}
       gtag('js', new Date());
       gtag('config', 'G-VQVKDJX0C3');
     </script>

  <script>
    document.addEventListener("DOMContentLoaded", function(event) {
      document.querySelector('.site-nav').setAttribute('onclick', '()=>{}');
    });
  </script>

   {% if page.url == "/" %}
     <script type="application/ld+json">
     {
       "@context": "https://schema.org",
       "@type": "WebSite",
       "name": "Yang Hu | UCL",
       "alternateName": ["Yang Hu | UCL", "yanghu.co.uk"],
       "url": "https://www.yanghu.co.uk/"
     }
     </script>
     {% endif %}
     <meta property="og:site_name" content="Yang Hu">

  <body id="top">

    {% include header.html %}

    {% if page.layout == "post" %}
    <main class="post-content" aria-label="Content">
    {% else %}
    <main class="page-content" aria-label="Content">
    {% endif %}
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
      
  </body>

</html>
